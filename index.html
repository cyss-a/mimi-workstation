<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#a78bfa" />
  <title>小朋友的成长日志 · 幼小衔接学习工作台</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- 顶部条 -->
    <header class="topbar">
      <button id="sidebarToggle" class="icon-btn" aria-label="侧栏">≡</button>
      <div class="topbar-title">
        <span class="brand">小朋友的成长日志</span>
        <span class="sub">幼小衔接学习工作台</span>
        <span class="topdate" id="topDate"></span>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="设置">⚙</button>
    </header>

    <!-- 主体：侧栏 + 内容 -->
    <div class="main">
      <nav id="sidebar" class="sidebar">
        <ul class="nav-list">
          <li data-route="dashboard"><span class="emoji" data-animal="home"></span><span>首页</span></li>
          <li data-route="pinyin"><span class="emoji" data-animal="panda"></span><span>拼音</span></li>
          <li data-route="sudoku"><span class="emoji" data-animal="fox"></span><span>数独</span></li>
          <li data-route="focus"><span class="emoji" data-animal="owl"></span><span>专注</span></li>
          <li data-route="raz"><span class="emoji" data-animal="rabbit"></span><span>句子跟读</span></li>
          <li data-route="ball"><span class="emoji" data-animal="monkey"></span><span>拍球</span></li>
          <li data-route="vestibular"><span class="emoji" data-animal="frog"></span><span>前庭运动</span></li>
          <li data-route="science"><span class="emoji" data-animal="bear"></span><span>科普</span></li>
          <li data-route="recite"><span class="emoji" data-animal="chick"></span><span>朗诵</span></li>
          <li data-route="checkin"><span class="emoji" data-animal="dog"></span><span>打卡</span></li>
          <li data-route="todo"><span class="emoji" data-animal="mouse"></span><span>待办</span></li>
          <li data-route="reading"><span class="emoji" data-animal="elephant"></span><span>阅读</span></li>
        </ul>
        <div class="sidebar-foot">
          <div class="cloud-state" id="cloudState">本地 · 未联网</div>
        </div>
      </nav>

      <main id="view" class="view">
        <div class="placeholder">加载中…</div>
      </main>
    </div>

    <!-- 设置弹窗 -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-card">
        <h3>⚙ 设置</h3>
        <div class="settings-block">
          <label>数据后端</label>
          <div class="seg">
            <button data-mode="supabase" class="active">☁️ Supabase（推荐·零配置）</button>
            <button data-mode="local">本地</button>
          </div>
          <p class="hint" id="modeHint">Supabase 模式：开箱即用、无需任何账号配置，数据自动同步到云端，手机/电脑随时续上。</p>
        </div>
        <div class="modal-actions">
          <button id="settingsCancel" class="btn ghost">取消</button>
          <button id="settingsSave" class="btn primary">保存</button>
        </div>
      </div>
    </div>

    <!-- 通用 Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
